<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>确认封禁 - BanDomain</title>
  <style>
    :root {
      --primary: #1976d2;
      --danger: #d32f2f;
      --success: #2e7d32;
      --bg: #f8f9fa;
      --text: #212529;
      --border: #ced4da;
    }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      box-sizing: border-box;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--danger);
    }
    #userInfo {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .warn {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 10px;
      color: #e65100;
      line-height: 1.5;
    }
    .field-label {
      font-size: 11px;
      color: #666;
      margin: 8px 0 2px;
      display: block;
    }
    .input-field {
      width: 100%;
      padding: 6px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      box-sizing: border-box;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }
    input[type="number"] { width: 80px; }
    .hint { font-size: 11px; color: #888; margin-left: 4px; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      flex: 1;
      padding: 8px 0;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }
    .btn:disabled { background: #bbb !important; cursor: not-allowed; }
    #confirmBtn { background: var(--danger); }
    #cancelBtn { background: #9e9e9e; }
    #closeBtn { background: var(--primary); display: none; }
    #msg {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="title">🚫 确认封禁</div>
  <div id="dirtyWarn" class="warn" style="display:none;"></div>
  <div id="userInfo">正在加载用户信息…</div>
  <div class="warn">封禁后该账号将被踢下线且无法再认证（按用户名匹配），请仔细核对后再执行。</div>

  <label class="field-label">封禁天数：</label>
  <div>
    <input type="number" id="daysInput" class="input-field" min="1" value="1" style="width:80px;" />
    <span class="hint">天（默认 1 天，到期自动解封）</span>
  </div>

  <label class="field-label">提示信息（用户端看到）：</label>
  <input type="text" id="memoInput" class="input-field" maxlength="80" />

  <div class="btn-row">
    <button id="confirmBtn" class="btn">确认封禁</button>
    <button id="cancelBtn" class="btn">取消</button>
    <button id="closeBtn" class="btn">关闭窗口</button>
  </div>

  <div id="msg"></div>

  <script src="sam-api.js"></script>
  <script src="ban.js"></script>
</body>
</html>
